<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16130f" />
    <meta name="color-scheme" content="dark" />
    <title>keyseed</title>
    <meta
      name="description"
      content="Type or tap a rhythm. Hash the cadence. Get a Solana-ish address out."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,560&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="desk" class="desk" data-state="ready">
      <div class="grain" aria-hidden="true"></div>
      <header class="mast">
        <h1>keyseed</h1>
        <p>cadence as input</p>
      </header>
      <div class="lamp" id="lamp">ready</div>

      <main class="stage">
        <p class="status" id="status">hold the key — then type or tap</p>

        <canvas
          id="tape"
          class="tape"
          width="640"
          height="120"
          role="img"
          aria-label="Live cadence tape. Dots mark each keystroke or pad tap."
        ></canvas>

        <button id="plunger" class="plunger" type="button" aria-pressed="false">
          <span class="hold-face">
            <span id="hold-word" class="hold-word">hold to seed</span>
            <span id="hold-meter" class="hold-meter"></span>
          </span>
        </button>

        <div class="pad" id="pad" role="group" aria-label="Soft tap pad"></div>

        <section id="plate" class="plate" hidden>
          <p class="plate-kicker">callsign</p>
          <code id="address" class="address"></code>
          <div id="chips" class="chips"></div>
          <p id="crumb" class="crumb"></p>
          <div class="acts">
            <button id="copy" class="act" type="button">copy address</button>
            <button id="again" class="act ghost" type="button">again</button>
          </div>
        </section>
      </main>

      <footer class="well">
        <p class="note">
          Preview seed from the typing — not a program-derived PDA. Sibling to
          <a href="https://robertkodes.github.io/tiltseed/">tiltseed</a>,
          <a href="https://robertkodes.github.io/micseed/">micseed</a>,
          <a href="https://robertkodes.github.io/camseed/">camseed</a>,
          <a href="https://robertkodes.github.io/drawseed/">drawseed</a>.
          On a desk, type. On a phone, tap the pad. Don’t send funds to a rhythm.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
